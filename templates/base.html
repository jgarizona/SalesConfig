<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}JLT Configurator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">JLT Inside-Sales Configurator <span class="draft-tag">rough draft</span></div>
    <div class="nav-wrap">
      <nav>
        <a href="{{ url_for('technical') }}" class="{{ 'active' if request.path == '/technical' else '' }}">Technical</a>
        <a href="{{ url_for('sales') }}" class="{{ 'active' if request.path == '/sales' or request.path == '/' else '' }}">Sales</a>
        <a href="{{ url_for('purchasing') }}" class="{{ 'active' if request.path.startswith('/purchasing') else '' }}">Purchasing</a>
        <a href="{{ url_for('admin') }}" class="{{ 'active' if request.path == '/admin' else '' }}">Admin</a>
        <a href="{{ url_for('logout') }}" style="opacity:0.6;">Log out</a>
      </nav>
      <div class="version-tag" title="Running git commit - compare against GitHub main">{{ app_version }}</div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
